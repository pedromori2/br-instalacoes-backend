spring:
  # Aponta por padrao para o Postgres do Supabase (Settings -> Database no painel do projeto -
  # use a "Connection string" no formato sessao/direta, nao a do pooler/pgbouncer, para o Flyway
  # funcionar sem surpresas). O banco padrao de todo projeto Supabase se chama "postgres".
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSLMODE:require}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # O Supabase instala algumas extensions/funcoes padrao dentro do schema "public" por conta
    # propria - o Flyway ve isso como "schema nao vazio" num banco novo e se recusa a migrar sem
    # uma tabela de historico. baseline-version=0 diz pra ele tratar o estado atual como "nada
    # migrado ainda" e rodar todas as migrations (V1+) normalmente, sem pular nenhuma.
    baseline-on-migrate: true
    baseline-version: 0

logging:
  level:
    com.brunofinanceiro: DEBUG
