spring:
  datasource:
    url: jdbc:h2:mem:financeiro_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

# O bean JwtDecoder real (baseado em JWKS) nem chega a ser usado nos testes - o TestSecurityConfig
# sobrescreve com um decoder que confia num par de chaves gerado so para os testes (ver
# IntegrationTestSupport), entao nao precisa de rede nem de um projeto Supabase real.
supabase:
  url: https://test.supabase.co
  service-role-key: test-service-role-key

app:
  cors:
    allowed-origins: http://localhost:3000
