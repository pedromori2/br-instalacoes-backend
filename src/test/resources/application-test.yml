spring:
  datasource:
    url: jdbc:h2:mem:financeiro_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

# Secret usado pelos testes para assinar JWT no formato Supabase (ver IntegrationTestSupport) -
# o NimbusJwtDecoder deste perfil confia no mesmo valor, entao nao precisa de rede nem de um
# projeto Supabase real para os testes autenticados passarem.
supabase:
  url: https://test.supabase.co
  jwt-secret: test-secret-key-not-for-production-use-0123456789-abcdefgh
  service-role-key: test-service-role-key

app:
  cors:
    allowed-origins: http://localhost:3000
